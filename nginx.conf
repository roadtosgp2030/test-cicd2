server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Enable Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
  gzip_min_length 256;
  gzip_vary on;
  gzip_static on;  # Serve pre-compressed .gz files if available

  # No cache for index.html to ensure users get the latest build
  location = /index.html {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private";
  }

  # Cache static assets with long expiry
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Security headers
  add_header X-Content-Type-Options "nosniff";
  add_header X-Frame-Options "DENY";
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
  add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data:;
    object-src 'none';
    base-uri 'self';
  ";

  # Remove version info
  server_tokens off;

  # SPA support – route all unmatched requests to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
