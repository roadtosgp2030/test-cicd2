blocks: |
  [
    {
      "type": "header",
      "text": {
        "type": "plain_text",
        "text": ":rocket: Deployment Update 🚀",
        "emoji": true
      }
    },
    {
      "type": "section",
      "fields": [
        {
          "type": "mrkdwn",
          "text": "*📦 Repository:*\n${{ github.repository }}"
        },
        {
          "type": "mrkdwn",
          "text": "*🌿 Branch:*\n${{ github.ref_name }}"
        },
        {
          "type": "mrkdwn",
          "text": "*🛠️ Workflow:*\n${{ github.workflow }}"
        },
        {
          "type": "mrkdwn",
          "text": "*📊 Status:*\n`${{ job.status }}`
          "
        }
      ]
    },
    {
      "type": "context",
      "elements": [
        {
          "type": "mrkdwn",
          "text": "👤 Triggered by *${{ github.actor }}* · 🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
        }
      ]
    }
  ]
